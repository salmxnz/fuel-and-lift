<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review Upper-1</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171A12}a:hover{color:#3E6B1F}
button:focus-visible,a:focus-visible{outline:2px solid #3E6B1F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 52px 16px 28px; background: #171A12; color: #FFFFFF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; color: #B9BFAF;">Upper-1 done, 2 of 4</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Quick review</h1>
    </div>
    <button style="font: inherit; font-size: 14px; font-weight: 700; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #4A5140; background: transparent; color: #FFFFFF;">Accept all</button>
  </div>

  <div role="progressbar" aria-label="Review progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
    <span style="height: 4px; border-radius: 2px; background: #C8F04D;"></span><span style="height: 4px; border-radius: 2px; background: #FFFFFF;"></span><span style="height: 4px; border-radius: 2px; background: #3A4032;"></span><span style="height: 4px; border-radius: 2px; background: #3A4032;"></span>
  </div>

  <div style="position: relative; flex: 1; margin-top: 8px;">
    <div aria-hidden="true" style="position: absolute; left: 28px; right: 28px; top: 28px; bottom: 0; border-radius: 26px; background: #3A4032;"></div>
    <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 14px; bottom: 14px; border-radius: 26px; background: #6A7260;"></div>

    <article aria-label="Lat pulldown" style="position: absolute; left: 0; right: 0; top: 0; bottom: 28px; transform: rotate(-2.5deg) translateX(-6px); transform-origin: 50% 100%; border-radius: 26px; background: #FFFFFF; color: #171A12; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 18px 40px rgba(0,0,0,0.35);">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <span style="font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #C8F04D;">+2.5 kg vs Upper-1</span>
        <span aria-hidden="true" style="font-size: 13px; font-weight: 800; color: #3E6B1F; border: 2px solid #3E6B1F; border-radius: 8px; padding: 4px 8px; transform: rotate(8deg);">Done</span>
      </div>
      <div style="height: 150px; border-radius: 18px; background: #EEF3DC; display: flex; align-items: center; justify-content: center;">
        <svg width="120" height="120" viewBox="0 0 64 64" fill="none" stroke="#171A12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Lat pulldown machine"><path d="M14 58V8h36"></path><path d="M50 8v6"></path><path d="M38 14h24"></path><path d="M50 14v14"></path><path d="M20 58h28"></path><path d="M28 46h18"></path><path d="M32 46v12"></path><path d="M30 38h14"></path><rect x="16" y="22" width="8" height="14" rx="2" fill="#C8F04D"></rect><path d="M20 8v14"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; color: #5C6355;">Back</span>
        <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em;">Lat pulldown</h2>
      </div>
      <table style="border-collapse: collapse; width: 100%; font-size: 15px;">
        <thead><tr><th scope="col" style="text-align: left; font-size: 12px; font-weight: 500; color: #5C6355; padding: 0 0 6px;">Set</th><th scope="col" style="text-align: left; font-size: 12px; font-weight: 500; color: #5C6355; padding: 0 0 6px;">Planned</th><th scope="col" style="text-align: left; font-size: 12px; font-weight: 500; color: #5C6355; padding: 0 0 6px;">Done</th></tr></thead>
        <tbody>
          <tr style="border-top: 1px solid #EEF0E8;"><td style="padding: 9px 0; color: #5C6355;">Warm-up</td><td style="padding: 9px 0;">10 kg</td><td style="padding: 9px 0;">10 kg</td></tr>
          <tr style="border-top: 1px solid #EEF0E8;"><td style="padding: 9px 0; font-weight: 700;">1</td><td style="padding: 9px 0;">35 kg, failure</td><td style="padding: 9px 0; font-weight: 700;">37.5 kg × 8</td></tr>
          <tr style="border-top: 1px solid #EEF0E8;"><td style="padding: 9px 0; font-weight: 700;">2</td><td style="padding: 9px 0;">35 kg, failure</td><td style="padding: 9px 0; font-weight: 700;">37.5 kg × 8</td></tr>
        </tbody>
      </table>
    </article>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end;">
    <button style="font: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; color: #FFFFFF; font-size: 13px; font-weight: 600;">
      <span style="width: 58px; height: 58px; border-radius: 50%; border: 1.5px solid #4A5140; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"></path></svg></span>Edit</button>
    <button style="font: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; color: #FFFFFF; font-size: 13px; font-weight: 600;">
      <span style="width: 58px; height: 58px; border-radius: 50%; border: 1.5px solid #4A5140; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>Skipped</button>
    <a href="Update-Template.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none;">
      <span style="width: 72px; height: 72px; border-radius: 50%; background: #C8F04D; color: #171A12; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Done</a>
  </div>
  <p style="margin: 0; text-align: center; font-size: 12px; color: #B9BFAF;">Swipe left to edit, up to skip, right when it is right</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
