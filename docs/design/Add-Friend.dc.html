        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 700;">8 friends join, Pro is yours forever</span>
          <span style="font-size: 12px; color: #B9BFAF;">A friend counts once they finish setting up.</span>

    </div>

      <label for="invite-url" style="font-size: 13px; font-weight: 600; color: #5C6355;">Your link</label>

        <input id="invite-url" readonly value="[your-app]/join/k3Tq9wX2" style="font: inherit; flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid #CDD1C4; background: #FFFFFF; color: #171A12; font-size: 14px;">
